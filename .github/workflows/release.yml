name: Release Build

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release version (must match the branch version, e.g. 2.6.0)'
        required: true
        type: string
permissions: write-all
env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0
concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  prepare_release:
    name: Approve Snapshot and Prepare Draft Release
    if: ${{ github.ref == 'refs/heads/dev-cn' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      release_tag: ${{ steps.source.outputs.release_tag }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      channel: ${{ steps.source.outputs.channel }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@v7
        with:
          ref: refs/heads/dev-cn
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.1'
      - name: Validate source and publish the approved snapshot
        id: source
        env:
          CN_VERSION: ${{ inputs.tag_name }}
        run: node scripts-workflow/release.mjs validate-tag

      - name: Create or reuse draft release
        id: draft
        env:
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: node scripts-workflow/release.mjs prepare-draft

  update_tag:
    name: Publish Completed Release
    env:
      RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}
    outputs:
      source_sha: ${{ needs.prepare_release.outputs.source_sha }}
      channel: ${{ needs.prepare_release.outputs.channel }}
    runs-on: ubuntu-latest
    needs:
      [
        prepare_release,
        release,
      ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare_release.outputs.source_sha }}

      - name: Group changelog platforms
        run: bash ./scripts-workflow/group_platforms.sh

      - name: Fetch UPDATE logs
        id: fetch_update_logs
        run: bash ./scripts/extract_update_logs.sh
        shell: bash

      - name: Set Env
        run: |
          echo "BUILDTIME=$(TZ=Asia/Shanghai date)" >> $GITHUB_ENV
          TAG_REF="$RELEASE_TAG"
          echo "TAG_NAME=$TAG_REF" >> $GITHUB_ENV
          VERSION=$(echo "$TAG_REF" | sed 's/^cn-v//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "DOWNLOAD_URL=https://github.com/${{ github.repository }}/releases/download/$TAG_REF" >> $GITHUB_ENV
        shell: bash

      - run: |
          if [ -z "$UPDATE_LOGS" ]; then
            echo "No update logs found, using default message"
            UPDATE_LOGS="More new features are now supported. Check for detailed changelog soon."
          else
            echo "Using found update logs"
          fi

          cat > release.txt << EOF
          [Clash Verge Rev](https://github.com/raymao96/clash-verge-rev/releases/tag/v2.6.0) CN v${VERSION}

          $UPDATE_LOGS

          ## 下载地址

          ### Windows (不再支持Win7)
          #### 正常版本(推荐)
          - [64位(常用)](${{ env.DOWNLOAD_URL }}/Clash.Verge_${{ env.VERSION }}_x64-setup.exe) | [ARM64(不常用)](${{ env.DOWNLOAD_URL }}/Clash.Verge_${{ env.VERSION }}_arm64-setup.exe)

          ### macOS
          - [Apple M芯片](${{ env.DOWNLOAD_URL }}/Clash.Verge_${{ env.VERSION }}_aarch64.dmg) | [Intel芯片](${{ env.DOWNLOAD_URL }}/Clash.Verge_${{ env.VERSION }}_x64.dmg)

          ### FAQ
          - [常见问题](https://clash-verge-rev.github.io/faq/windows.html)

          ### 稳定机场VPN推荐
          - [狗狗加速](https://cvr.dginv.click/#/register?code=oaxsAGo6)

          Created at ${{ env.BUILDTIME }}.
          EOF

      - name: Verify release tag still points to the approved source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.prepare_release.outputs.source_sha }}
        run: node scripts-workflow/release.mjs verify-target

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ contains(env.RELEASE_TAG, '-rc') }}
        run: |
          release_id="${{ needs.prepare_release.outputs.release_id }}"

          if [ -z "$release_id" ]; then
            echo "::error::No prepared release ID found for $TAG_NAME."
            exit 1
          fi

          release_info=$(gh api repos/{owner}/{repo}/releases/"$release_id" --jq '[.tag_name, .draft, (.assets | length), .html_url] | @tsv')
          IFS=$'\t' read -r release_tag _ asset_count release_url <<< "$release_info"

          if [ "$release_tag" != "$TAG_NAME" ]; then
            echo "::error::Prepared release $release_id belongs to $release_tag, expected $TAG_NAME."
            exit 1
          fi

          echo "Publishing release $release_id ($release_url) with $asset_count assets."

          gh api --method PATCH repos/{owner}/{repo}/releases/"$release_id" \
            -f name="Clash Verge Rev CN v${VERSION}" \
            -F body=@release.txt \
            -F draft=false \
            -F prerelease="$PRERELEASE" \
            --silent

  release:
    name: Release Build
    needs: [prepare_release]
    env:
      RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare_release.outputs.source_sha }}

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.100.0'
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev-cn' }}
          prefix-key: 'v1-rust'
          shared-key: 'rust-shared-stable-${{ matrix.os }}-${{ matrix.target }}'
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.1'
          cache: 'pnpm'

      - name: Pnpm install and check
        run: |
          pnpm i
          pnpm run prebuild ${{ matrix.target }}

      - name: Tauri build
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare_release.outputs.release_id }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseBody: 'Draft release, will be updated later.'
          releaseDraft: true
          prerelease: ${{ needs.prepare_release.outputs.channel == 'rc' }}
          releaseCommitish: ${{ needs.prepare_release.outputs.source_sha }}
          tauriScript: pnpm
          args: --target ${{ matrix.target }}
          uploadUpdaterJson: false

      - name: Attest Windows bundles
        if: matrix.os == 'windows-latest'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: target/${{ matrix.target }}/release/bundle/nsis/*setup*

      - name: Attest macOS bundles
        if: matrix.os == 'macos-latest'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: target/${{ matrix.target }}/release/bundle/dmg/*.dmg
